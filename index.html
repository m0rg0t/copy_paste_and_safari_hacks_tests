<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>"
    />
    <title>How to paste images and text (even in Safari)</title>
  </head>
  <body>
    <style>
      :root {
        color-scheme: dark light;
      }

      html {
        box-sizing: border-box;
      }

      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }

      body {
        margin: 1rem;
        font-family: system-ui, sans-serif;
      }

      button {
        display: block;
      }

      .outputElement {
        margin: 1rem 0;

        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;

        border: 1px solid #ccc;
        padding: 0.5rem;
      }

      .outputElement img {
        max-width: 100%;
        max-height: 100px;
      }
    </style>
    <h1>How to paste images</h1>
    <p>
      Hit <kbd>⌘</kbd> + <kbd>v</kbd> (for macOS) or <kbd>ctrl</kbd> +
      <kbd>v</kbd>
      (for other operating systems) to paste images anywhere in this page.
    </p>
    <hr />
    <!-- <form>
      <h2>Form to test input focuses for safari</h2>
      <input type="text" placeholder="regular text input" />
      <textarea id="superfocus" placeholder="superfocus" autofocus></textarea>
    </form> -->
    <hr />

    <div id="output"></div>

    <p id="status" role="status"></p>
    <button id="clear" type="button">Clear pasted content</button>
    <script src="./clipboard.js"></script>
  </body>
</html>
